site_name: Прикладні алгоритми кіберфізичних систем
site_description: Навчальний портал з дисципліни "Прикладні алгоритми КФС"

theme:
  name: material
  language: uk
  
  # Правильне підключення іконки логотипу
  icon:
    logo: material/chip
    favicon: material/chip

  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Переключити на темну тему
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Переключити на світлу тему

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - header.autohide
    - search.suggest
    - search.highlight
    - content.code.copy

font:
  text: Roboto
  code: JetBrains Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  # Підтримка Mermaid діаграм
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  # Формули LaTeX
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

# Підключення MathJax для рендерингу формул
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Головна: index.md
  - РНП: rnp.md
  
  - Лекції:
      - "Тема 1. Теоретичні засади": lectures/topic-1.md
      - "Тема 2. Керуючі конструкції": lectures/topic-2.md
      - "Тема 3. Архітектура та обмін даними": lectures/topic-3.md
      - "Тема 4. Обробка структурованих даних": lectures/topic-4.md
      - "Тема 5. Нечітка логіка та евристики": lectures/topic-5.md
      - "Тема 6. Пошук, сортування та графи": lectures/topic-6.md
      - "Тема 7. Хмарні та граничні обчислення": lectures/topic-7.md

  - Лабораторні роботи:
      - "ЛБ 1. Логіка низького рівня": labs/lab-1.md
      - "ЛБ 2. Обробка даних з давачів": labs/lab-2.md
      - "ЛБ 3. Потоки даних u Node-RED": labs/lab-3.md
      - "ЛБ 4. Обробка матриць сигналів": labs/lab-4.md
      - "ЛБ 5. Нечіткий контролер": labs/lab-5.md
      - "ЛБ 6. Маршрутизація в мережах": labs/lab-6.md
      - "ЛБ 7. Віртуалізація в Docker": labs/lab-7.md

  - Практичні заняття:
      - "ПЗ 1. Графічна формалізація": practicals/pz-1.md
      - "ПЗ 2. Трудомісткість процесів": practicals/pz-2.md
      - "ПЗ 3. Ієрархія тем MQTT": practicals/pz-3.md
      - "ПЗ 4. Черга повідомлень": practicals/pz-4.md
      - "ПЗ 5. Задачі маршрутизації": practicals/pz-5.md
      - "ПЗ 6. Аналіз методів сортування": practicals/pz-6.md
      - "ПЗ 7. Архітектури Big Data": practicals/pz-7.md

  - Самостійна робота: self-study/index.md
  - РГР: rgr/index.md
  - Контрольні роботи: kr/index.md
