site_name: Прикладні алгоритми кіберфізичних систем
site_description: Навчальний портал з дисципліни "Прикладні алгоритми КФС"

theme:
  name: material
  language: uk
  
  # Логотип і фавікон (використовуємо вбудовані іконки)
  logo: material/chip
  favicon: material/chip

  palette:
    # Світла тема
    - scheme: default
      primary: indigo          # Основний колір (можна змінити на teal, blue, deep purple)
      accent: cyan             # Акцентний колір (для посилань/кнопок)
      toggle:
        icon: material/brightness-7
        name: Переключити на темну тему
    # Темна тема
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Переключити на світлу тему

  features:
    - navigation.tabs          # Верхні вкладки
    - navigation.tabs.sticky   # Вкладки прилипають при скролі
    - navigation.sections      # Групування розділів
    - navigation.expand        # Автоматичне розгортання бокового меню
    - navigation.top           # Кнопка "Нагору" з'являється при гортанні вниз
    - navigation.tracking      # URL змінюється залежно від прокрутки
    - header.autohide          # Шапка ховається при скролі вниз (більше місця для читання)
    - search.suggest           # Підказки в пошуку
    - search.highlight         # Підсвічування результатів пошуку
    - search.share             # Кнопка поділитися пошуком
    - content.code.copy        # Кнопка "Скопіювати код" в усіх блоках коду

# Шрифт (можна змінити за бажанням)
font:
  text: Roboto
  code: JetBrains Mono

# РОЗШИРЕННЯ МАРКДАУН (ДЛЯ КРАСИВОГО КОНТЕНТУ)
markdown_extensions:
  - admonition                 # Кольорові блоки підказок (Info, Warning, Note)
  - pymdownx.details           # Блоки, що згортаються
  - pymdownx.superfences       # Покращений код
  - pymdownx.highlight:        # Підсвітка синтаксису коду
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:           # Вкладки всередині тексту (наприклад, Windows/Linux/macOS)
      alternate_style: true
  - pymdownx.emoji:            # Підтримка іконок та емоджі
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:         # Чекбокси для завдань
      custom_checkbox: true
  - pymdownx.arithmatex:       # Формули LaTeX
      generic: true
  - tables                     # Красиві таблиці
  - attr_list                  # Можливість додавати CSS-класи (кнопки, теги)

# Подключение кастомного CSS
extra_css:
  - stylesheets/extra.css

# ДЕРЕВО НАВІГАЦІЇ
nav:
  - Головна: index.md
  - РНП: rnp.md
  
  - Лекції:
      - "Тема 1. Теоретичні засади": lectures/topic-1.md
      - "Тема 2. Керуючі конструкції": lectures/topic-2.md
      - "Тема 3. Архітектура та обмін даними": lectures/topic-3.md
      - "Тема 4. Обробка структурованих даних": lectures/topic-4.md
      - "Тема 5. Нечітка логіка та евристики": lectures/topic-5.md
      - "Тема 6. Пошук, сортування та графи": lectures/topic-6.md
      - "Тема 7. Хмарні та граничні обчислення": lectures/topic-7.md

  - Лабораторні роботи:
      - "ЛБ 1. Логіка низького рівня": labs/lab-1.md
      - "ЛБ 2. Обробка даних з давачів": labs/lab-2.md
      - "ЛБ 3. Потоки даних u Node-RED": labs/lab-3.md
      - "ЛБ 4. Обробка матриць сигналів": labs/lab-4.md
      - "ЛБ 5. Нечіткий контролер": labs/lab-5.md
      - "ЛБ 6. Маршрутизація в мережах": labs/lab-6.md
      - "ЛБ 7. Віртуалізація в Docker": labs/lab-7.md

  - Практичні заняття:
      - "ПЗ 1. Графічна формалізація": practicals/pz-1.md
      - "ПЗ 2. Трудомісткість процесів": practicals/pz-2.md
      - "ПЗ 3. Ієрархія тем MQTT": practicals/pz-3.md
      - "ПЗ 4. Черга повідомлень": practicals/pz-4.md
      - "ПЗ 5. Задачі маршрутизації": practicals/pz-5.md
      - "ПЗ 6. Аналіз методів сортування": practicals/pz-6.md
      - "ПЗ 7. Архітектури Big Data": practicals/pz-7.md

  - Самостійна робота: self-study/index.md
  - РГР: rgr/index.md
  - Контрольні роботи: kr/index.md
